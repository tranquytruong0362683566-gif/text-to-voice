<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ElevenLabs TTS Code By Trần Quý Trường</title>
<style>
/* ─── RESET & VARIABLES ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #f1f5f9;
  --surface:   #ffffff;
  --border:    #e2e8f0;
  --border-2:  #cbd5e1;
  --input-bg:  #ffffff;
  --accent:    #0f172a;
  --accent-h:  #1e293b;
  --muted:     #64748b;
  --muted-2:   #94a3b8;
  --success:   #16a34a;
  --error:     #dc2626;
  --warn:      #d97706;
  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.05);
  --shadow:    0 4px 12px rgba(15,23,42,.05);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

/* Tùy chỉnh thanh cuộn cho đẹp */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted-2); }

html { font-size: 14px; }
body {
  background: var(--bg);
  color: var(--accent);
  font-family: var(--font);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.app {
  width: 100%;
  max-width: 1600px;
  background: var(--surface);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,.08);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: calc(100vh - 40px);
}

/* ─── HEADER ─── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo { display: flex; align-items: center; gap: 12px; }
.logo-name { display: block; font-size: 16px; font-weight: 700; letter-spacing: -.3px; color: var(--accent); line-height: 1.2; }
.logo-sub  { display: block; font-size: 12px; color: var(--muted); letter-spacing: .2px; }

/* ─── 3-COLUMN LAYOUT ─── */
.main-grid {
  display: grid;
  grid-template-columns: 1fr;
  flex: 1;
  overflow: hidden;
}

@media (min-width: 1100px) {
  .main-grid {
    grid-template-columns: 320px 1fr 360px;
  }
}

.panel-column {
  overflow-y: auto;
  padding: 24px;
}

.config-panel { background: #f8fafc; border-right: 1px solid var(--border); }
.history-panel { background: #f8fafc; border-left: 1px solid var(--border); display: flex; flex-direction: column;}

/* ─── CỘT CẤU HÌNH (TRÁI) ─── */
.panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.panel-title { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.model-chip { font-size: 11px; font-weight: 700; background: var(--accent); color: #fff; padding: 4px 10px; border-radius: 20px; }

.api-keys-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
.api-keys-label { font-size: 12px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
.api-keys-label svg { flex-shrink: 0; color: var(--muted); }
.api-keys-note { font-weight: 400; color: var(--muted); font-size: 11px; }

.api-key-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.api-key-row:last-of-type { margin-bottom: 0; }
.api-key-num { width: 24px; height: 24px; background: #f1f5f9; border: 1px solid var(--border); border-radius: 50%; font-size: 11px; font-weight: 700; color: var(--muted); display: grid; place-items: center; flex-shrink: 0; }
.api-key-input-wrap { position: relative; flex: 1; }
.api-key-input { width: 100%; height: 34px; background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 30px 0 10px; font-family: 'Courier New', monospace; font-size: 12px; color: var(--accent); outline: none; transition: all .15s ease; }
.api-key-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,23,42,.06); background: #fff; }
.api-key-input::placeholder { color: var(--muted-2); font-family: var(--font); font-size: 12px; }
.eye-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted-2); cursor: pointer; padding: 4px; display: grid; place-items: center; }
.eye-btn:hover { color: var(--accent); }

.key-status { font-size: 11px; font-weight: 600; white-space: nowrap; min-width: 65px; text-align: right; color: var(--muted-2); }
.key-status.active { color: var(--success); }
.key-status.error { color: var(--error); }
.key-status.standby { color: var(--muted); }

.field { margin-bottom: 16px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
.field input[type="text"] { width: 100%; height: 38px; background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 12px; font-family: var(--font); font-size: 13px; color: var(--accent); outline: none; box-shadow: var(--shadow-sm); transition: all 0.15s; }
.field input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,23,42,.06); }

.slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.slider-val { font-size: 13px; font-weight: 700; color: var(--accent); }
input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
input[type=range]:focus { outline: none; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; background: #e2e8f0; border-radius: 3px; cursor: pointer; }
input[type=range]::-webkit-slider-thumb { height: 16px; width: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; -webkit-appearance: none; margin-top: -5px; }
.slider-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted-2); margin-top: 6px; }

.save-btn { width: 100%; height: 40px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s; margin-top: 10px; }
.save-btn:hover { background: var(--accent-h); }

/* ─── CỘT WORKSPACE (GIỮA) ─── */
.tts-section { display: flex; flex-direction: column; gap: 16px; background: var(--surface); }
.tts-top-bar { display: flex; justify-content: space-between; align-items: center; }
.section-label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }

.char-controls { display: flex; align-items: center; gap: 12px; }
.char-count { font-size: 12px; color: var(--muted-2); font-weight: 500; }
.clear-text-btn { background: #fef2f2; color: var(--error); border: 1px solid #fecaca; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 4px; cursor: pointer; transition: all 0.2s;}
.clear-text-btn:hover { background: var(--error); color: white; }

.text-area { width: 100%; flex: 1; min-height: 250px; background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; font-family: var(--font); font-size: 15px; color: var(--accent); line-height: 1.7; resize: none; outline: none; box-shadow: var(--shadow-sm); transition: all .15s ease; }
.text-area:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,23,42,.06); background: #fff; }

/* Thẻ âm thanh sinh động */
.tags-wrap { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.tags-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); display: block; margin-bottom: 10px; }
.tags-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-btn { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--accent); font-size: 12px; font-weight: 500; padding: 5px 10px; cursor: pointer; transition: all .15s ease; }
.tag-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.tag-btn:active { transform: scale(.96); }

.generate-btn { width: 100%; height: 48px; background: var(--accent); border: none; border-radius: var(--radius); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 12px rgba(15,23,42,0.15); transition: all .15s ease; flex-shrink: 0;}
.generate-btn:hover { background: var(--accent-h); }
.generate-btn:disabled { opacity: .6; cursor: not-allowed; }

.spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── CỘT LỊCH SỬ (PHẢI) ─── */
.history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;}
.del-all-btn { background: #fef2f2; border: 1px solid #fee2e2; font-size: 11px; font-weight: 600; color: var(--error); cursor: pointer; padding: 4px 10px; border-radius: var(--radius-sm); transition: all .15s; }
.del-all-btn:hover { background: var(--error); color: #fff; }

.history-list { display: flex; flex-direction: column; gap: 12px; flex: 1; overflow-y: auto; padding-right: 4px; }
.history-empty { text-align: center; font-size: 13px; color: var(--muted-2); padding: 40px 0; }

.history-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-sm); transition: all 0.2s ease; }
.history-item:hover { border-color: var(--border-2); box-shadow: var(--shadow); }

.hist-content { flex: 1; min-width: 0; }
.hist-text { font-size: 13px; font-weight: 600; color: var(--accent); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.hist-date { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }

.hist-actions-group { display: flex; align-items: center; gap: 6px; }
.hist-play-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 32px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s; }
.hist-play-btn:hover { background: var(--accent-h); }
.hist-play-btn.playing { background: #475569; }

.hist-action-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--muted); cursor: pointer; transition: all .15s; }
.hist-action-btn:hover { border-color: var(--accent); color: var(--accent); background: #f8fafc; }
.hist-action-btn.del:hover { border-color: var(--error); color: var(--error); background: #fef2f2; }
.hist-audio-el { display: none; }

/* ─── TOAST & PROGRESS ─── */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 30px; font-size: 13.5px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 1100; transition: all .2s ease; }
.toast.hidden { opacity: 0; transform: translate(-50%, 10px); pointer-events: none; }
.toast.success { background: #0f172a; color: #fff; }
.toast.error { background: #fef2f2; color: var(--error); border: 1px solid #fecaca; }
.toast.info { background: #fff; color: var(--accent); border: 1px solid var(--border); }
.hidden { display: none !important; }

.progress-wrap { width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 8px;}
.progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width .2s; }
</style>
</head>
<body>

<div class="app">

  <header>
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="8" fill="#0f172a"/>
        <rect x="6"  y="10" width="3" height="8"  rx="1.5" fill="white" opacity="0.5"/>
        <rect x="11" y="6"  width="3" height="16" rx="1.5" fill="white"/>
        <rect x="16" y="9"  width="3" height="10" rx="1.5" fill="white" opacity="0.7"/>
        <rect x="21" y="12" width="3" height="4"  rx="1.5" fill="white" opacity="0.4"/>
      </svg>
      <div>
        <span class="logo-name">ElevenLabs TTS</span>
        <span class="logo-sub">Professional Workspace</span>
      </div>
    </div>
  </header>

  <div class="main-grid">

    <section class="panel-column config-panel">
      <div class="panel-header">
        <span class="panel-title">Cấu hình hệ thống</span>
        <span class="model-chip">eleven_v3 ⭐</span>
      </div>

      <div class="api-keys-block">
        <div class="api-keys-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          API Keys Quota <span class="api-keys-note">— tự động xoay tua</span>
        </div>

        <div class="api-key-row"><div class="api-key-num">1</div><div class="api-key-input-wrap"><input type="password" id="apiKey1" class="api-key-input" placeholder="Bắt buộc (sk_...)" autocomplete="off"/><button class="eye-btn" data-toggle="apiKey1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><span class="key-status" id="badge1"></span></div>
        <div class="api-key-row"><div class="api-key-num">2</div><div class="api-key-input-wrap"><input type="password" id="apiKey2" class="api-key-input" placeholder="Dự phòng 2" autocomplete="off"/><button class="eye-btn" data-toggle="apiKey2"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><span class="key-status" id="badge2"></span></div>
        <div class="api-key-row"><div class="api-key-num">3</div><div class="api-key-input-wrap"><input type="password" id="apiKey3" class="api-key-input" placeholder="Dự phòng 3" autocomplete="off"/><button class="eye-btn" data-toggle="apiKey3"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><span class="key-status" id="badge3"></span></div>
        <div class="api-key-row"><div class="api-key-num">4</div><div class="api-key-input-wrap"><input type="password" id="apiKey4" class="api-key-input" placeholder="Dự phòng 4" autocomplete="off"/><button class="eye-btn" data-toggle="apiKey4"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><span class="key-status" id="badge4"></span></div>
        <div class="api-key-row"><div class="api-key-num">5</div><div class="api-key-input-wrap"><input type="password" id="apiKey5" class="api-key-input" placeholder="Dự phòng 5" autocomplete="off"/><button class="eye-btn" data-toggle="apiKey5"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><span class="key-status" id="badge5"></span></div>
      </div>

      <div class="field">
        <label for="voiceId">Voice ID</label>
        <input type="text" id="voiceId" value="pNInz6obpgDQGcFmaJgB" placeholder="Nhập ElevenLabs Voice ID..." autocomplete="off"/>
      </div>

      <div class="field">
        <div class="slider-header">
          <label for="stabilitySlider">Stability (Độ ổn định)</label>
          <span id="stabilityVal" class="slider-val">0.50</span>
        </div>
        <input type="range" id="stabilitySlider" min="0" max="1" step="0.05" value="0.5"/>
        <div class="slider-labels"><span>Sáng tạo (Creative)</span><span>Ổn định (Robust)</span></div>
      </div>

      <button class="save-btn" id="saveBtn">Lưu cấu hình thiết bị</button>
    </section>

    <section class="panel-column tts-section">
      <div class="tts-top-bar">
        <span class="section-label">Văn bản kịch bản</span>
        <div class="char-controls">
          <button id="clearTextBtn" class="clear-text-btn">Xóa văn bản</button>

          <button class="tag-btn" data-tag="[confident]">Tự tin</button>
          <button class="tag-btn" data-tag="[calm]">Bình tĩnh</button>
          <button class="tag-btn" data-tag="[serious]">Nghiêm túc</button>
          <button class="tag-btn" data-tag="[playful]">Tinh nghịch</button>
          <button class="tag-btn" data-tag="[worried]">Lo âu</button>
          <button class="tag-btn" data-tag="[frustrated]">Nản lòng</button>
          <button class="tag-btn" data-tag="[hopeful]">Hy vọng</button>
          <button class="tag-btn" data-tag="[relieved]">Nhẹ nhõm</button>
          <button class="tag-btn" data-tag="[disappointed]">Thất vọng</button>

          <button class="tag-btn" data-tag="[tired]">Mệt mỏi</button>

      </div>

      <div>
        <button class="generate-btn" id="generateBtn">
          <svg id="btnPlayIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          <div id="btnSpinner" class="spinner hidden"></div>

        <div class="progress-wrap hidden" id="progressWrap">

      </div>
    </section>

    <section class="panel-column history-panel">
      <div class="history-header">
        <span class="section-label">Lịch sử file đã tạo</span>
        <button class="del-all-btn" id="deleteAllBtn">Xóa tất cả</button>
      </div>
      
      <div id="historyList" class="history-list"></div>
      <p class="history-empty hidden" id="historyEmpty">Chưa ghi nhận tệp tin âm thanh nào xuất xưởng.</p>
    </section>

  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
'use strict';

const LS_PREFIX = 'elevenlabs_pro_';
const MAX_HISTORY = 20;

function lsGet(key) { try { return localStorage.getItem(LS_PREFIX + key); } catch { return null; } }
function lsSet(key, val) { try { localStorage.setItem(LS_PREFIX + key, val); } catch {} }
function lsRemove(key) { try { localStorage.removeItem(LS_PREFIX + key); } catch {} }
function lsGetJSON(key, fallback) {
  const raw = lsGet(key); if (!raw) return fallback;
  try { return JSON.parse(raw); } catch { return fallback; }
}
function lsSetJSON(key, val) { lsSet(key, JSON.stringify(val)); }

// Elements Mapping
const elVoiceId        = document.getElementById('voiceId');
const elStability      = document.getElementById('stabilitySlider');
const elStabilityVal   = document.getElementById('stabilityVal');
const elSaveBtn        = document.getElementById('saveBtn');
const elTextInput      = document.getElementById('textInput');
const elCharCount      = document.getElementById('charCount');
const elClearTextBtn   = document.getElementById('clearTextBtn');
const elGenerateBtn    = document.getElementById('generateBtn');
const elBtnPlayIcon    = document.getElementById('btnPlayIcon');
const elBtnSpinner     = document.getElementById('btnSpinner');
const elBtnText        = document.getElementById('btnText');
const elHistoryList    = document.getElementById('historyList');
const elHistoryEmpty   = document.getElementById('historyEmpty');
const elDeleteAllBtn   = document.getElementById('deleteAllBtn');
const elToast          = document.getElementById('toast');
const elProgressWrap   = document.getElementById('progressWrap');
const elProgressBar    = document.getElementById('progressBar');

// System state
let activeKeyIndex = lsGetJSON('activeKeyIndex', 0);
let failedKeys     = lsGetJSON('failedKeys', []);
let toastTimer     = null;

// Initialization
(function init() {
  for (let i = 1; i <= 5; i++) {
    const k = lsGet(`apiKey${i}`);
    if (k) document.getElementById(`apiKey${i}`).value = k;
  }
  
  const vi = lsGet('voiceId'); 
  if (vi) elVoiceId.value = vi;

  const st = lsGet('stability');
  if (st !== null) {
    elStability.value = st;
    elStabilityVal.textContent = parseFloat(st).toFixed(2);
  }
  const draft = lsGet('draftText');
  if (draft) { elTextInput.value = draft; updateCharCount(); }
  
  updateKeyBadges(activeKeyIndex, failedKeys);
  renderHistoryUI();
})();

// Eye toggles for passwords
document.querySelectorAll('.eye-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.toggle);
    input.type = input.type === 'password' ? 'text' : 'password';
  });
});

elStability.addEventListener('input', e => { elStabilityVal.textContent = parseFloat(e.target.value).toFixed(2); });
elTextInput.addEventListener('input', () => { updateCharCount(); lsSet('draftText', elTextInput.value); });

// Xóa văn bản
elClearTextBtn.addEventListener('click', () => {
  elTextInput.value = '';
  updateCharCount();
  lsRemove('draftText');
  elTextInput.focus();
});

// Lưu cấu hình
elSaveBtn.addEventListener('click', () => {
  const keys = [];
  for (let i = 1; i <= 5; i++) {
    keys.push(document.getElementById(`apiKey${i}`).value.trim());
    lsSet(`apiKey${i}`, keys[i-1]);
  }
  const voiceId = elVoiceId.value.trim();
  if (!keys[0]) { toast('Vui lòng khai báo ít nhất API Key số 1', 'error'); return; }
  if (!voiceId) { toast('Thiếu tham số định dạng Voice ID', 'error'); return; }

  lsSet('voiceId', voiceId);
  lsSet('stability', elStability.value);
  activeKeyIndex = 0;
  failedKeys = [];
  lsSetJSON('activeKeyIndex', 0);
  lsSetJSON('failedKeys', []);
  updateKeyBadges(0, []);
  toast('Hệ thống cập nhật cấu hình thành công!', 'success');
});

// Chèn Tag
document.querySelectorAll('.tag-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tag = btn.dataset.tag; // Lấy tag gốc tiếng Anh
    const start = elTextInput.selectionStart;
    const end = elTextInput.selectionEnd;
    const text = elTextInput.value;
    elTextInput.value = text.slice(0, start) + tag + text.slice(end);
    elTextInput.selectionStart = elTextInput.selectionEnd = start + tag.length;
    elTextInput.focus();
    updateCharCount();
    lsSet('draftText', elTextInput.value);
  });
});

// Generate Audio
elGenerateBtn.addEventListener('click', async () => {
  const text = elTextInput.value.trim();
  const voiceId = elVoiceId.value.trim() || lsGet('voiceId');
  const stability = parseFloat(elStability.value || lsGet('stability') || '0.5');

  if (!voiceId) { toast('Thiếu thông số cấu hình Voice ID', 'error'); return; }
  if (!text) { toast('Nội dung văn bản trống', 'error'); return; }

  const keys = [];
  for(let i=1; i<=5; i++) {
    const val = document.getElementById(`apiKey${i}`).value.trim() || lsGet(`apiKey${i}`);
    if(val) keys.push(val);
  }
  if (keys.length === 0) { toast('Chưa có thông tin API Key dự phòng nào khả dụng', 'error'); return; }

  setLoadingState(true);
  let buffer = null;
  let keyIndex = activeKeyIndex;
  let localFailed = [...failedKeys];

  try {
    while (keyIndex < keys.length) {
      if (localFailed.includes(keyIndex)) { keyIndex++; continue; }
      const activeToken = keys[keyIndex];

      let res;
      try {
        res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
          method: 'POST',
          headers: {
            'xi-api-key': activeToken,
            'Content-Type': 'application/json',
            'Accept': 'audio/mpeg'
          },
          body: JSON.stringify({
            text,
            model_id: 'eleven_v3',
            output_format: 'mp3_44100_128',
            voice_settings: { stability, similarity_boost: 0.75 }
          })
        });
      } catch {
        throw new Error('Kết nối mạng gián đoạn, không thể gửi yêu cầu.');
      }

      if ([401, 402, 422, 429].includes(res.status)) {
        const originIndex = keyIndex;
        localFailed.push(keyIndex);
        keyIndex++;
        activeKeyIndex = keyIndex;
        failedKeys = localFailed;
        lsSetJSON('activeKeyIndex', keyIndex);
        lsSetJSON('failedKeys', localFailed);
        updateKeyBadges(keyIndex, localFailed);
        toast(`Key số ${originIndex + 1} quá tải/hết hạn. Chuyển tiếp cấu hình Key số ${keyIndex + 1}`, 'warn');
        continue;
      }

      if (!res.ok) {
        throw new Error(`ElevenLabs API Error: Mã phản hồi trạng thái HTTP ${res.status}`);
      }

      buffer = await res.arrayBuffer();
      activeKeyIndex = keyIndex;
      failedKeys = localFailed;
      lsSetJSON('activeKeyIndex', keyIndex);
      lsSetJSON('failedKeys', localFailed);
      updateKeyBadges(keyIndex, localFailed);
      break;
    }

    if (!buffer) throw new Error('Toàn bộ hệ thống 5 API Keys dự phòng đều từ chối hoặc hết hạn ngạch.');

    const bytes = new Uint8Array(buffer);
    let binary = '';
    for (let i = 0; i < bytes.byteLength; i += 8192) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    }
    const dataUrl = 'data:audio/mpeg;base64,' + btoa(binary);

    const historyIndex = lsGetJSON('historyIndex', []);
    const audioId = 'audio_' + Date.now();
    
    // Đã sửa: Bỏ giới hạn độ dài ký tự của tiêu đề tên file
    const cleanSnippet = text.replace(/\[.*?\]/g, '').replace(/\s+/g, ' ').trim();

    historyIndex.unshift({
      id: audioId,
      text: cleanSnippet || 'am_thanh_elevenlabs',
      date: new Date().toLocaleString('vi-VN')
    });

    const discarded = historyIndex.splice(MAX_HISTORY);
    discarded.forEach(item => lsRemove(item.id));

    lsSet(audioId, dataUrl);
    lsSetJSON('historyIndex', historyIndex);

    setLoadingState(false);
    toast('Khởi tạo xử lý giọng nói thành công!', 'success');
    renderHistoryUI();

  } catch (err) {
    setLoadingState(false);
    toast(err.message, 'error');
  }
});

// Render Lịch Sử
function renderHistoryUI() {
  const index = lsGetJSON('historyIndex', []);
  elHistoryList.innerHTML = '';
  
  if (index.length === 0) {
    elHistoryEmpty.classList.remove('hidden');
    return;
  }
  elHistoryEmpty.classList.add('hidden');
  index.forEach(item => buildHistoryRow(item));
}

function buildHistoryRow(item) {
  const dataUrl = lsGet(item.id);
  const card = document.createElement('div');
  card.className = 'history-item';
  card.id = `card-${item.id}`;

  const audio = document.createElement('audio');
  audio.className = 'hist-audio-el';
  if (dataUrl) {
    try {
      const parts = dataUrl.split(',');
      const mime = parts[0].match(/:(.*?);/)[1];
      const rawStr = atob(parts[1]);
      const arr = new Uint8Array(rawStr.length);
      for (let i = 0; i < rawStr.length; i++) arr[i] = rawStr.charCodeAt(i);
      audio.src = URL.createObjectURL(new Blob([arr], { type: mime }));
    } catch {
      audio.src = dataUrl;
    }
  }

  const contentWrap = document.createElement('div');
  contentWrap.className = 'hist-content';
  contentWrap.innerHTML = `<div class="hist-text" title="${esc(item.text)}">${esc(item.text)}</div>
                           <div class="hist-date">
                             <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                             ${item.date}
                           </div>`;

  const actionGroup = document.createElement('div');
  actionGroup.className = 'hist-actions-group';

  const playBtn = document.createElement('button');
  playBtn.className = 'hist-play-btn';
  playBtn.innerHTML = `<span>Phát</span>`;

  audio.addEventListener('ended', () => {
    playBtn.textContent = 'Phát';
    playBtn.classList.remove('playing');
  });

  playBtn.addEventListener('click', () => {
    if (!audio.paused) {
      audio.pause();
      playBtn.textContent = 'Phát';
      playBtn.classList.remove('playing');
    } else {
      document.querySelectorAll('.hist-audio-el').forEach(a => a.pause());
      document.querySelectorAll('.hist-play-btn').forEach(b => { b.textContent = 'Phát'; b.classList.remove('playing'); });
      audio.play();
      playBtn.textContent = 'Dừng';
      playBtn.classList.add('playing');
    }
  });

  const dlBtn = document.createElement('button');
  dlBtn.className = 'hist-action-btn';
  dlBtn.title = 'Tải xuống tệp tin MP3';
  dlBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
  
  // Đã sửa: Đặt tên file tải xuống theo đúng tiêu đề văn bản, bỏ các kí tự bị cấm trên hệ điều hành
  dlBtn.addEventListener('click', () => {
    if(!dataUrl) return;
    const a = document.createElement('a');
    a.href = audio.src;
    let safeFileName = item.text.replace(/[\\/:*?"<>|]/g, '_');
    a.download = `${safeFileName}.mp3`;
    a.click();
  });

  const delBtn = document.createElement('button');
  delBtn.className = 'hist-action-btn del';
  delBtn.title = 'Xóa mục này';
  delBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;
  delBtn.addEventListener('click', () => {
    if(!confirm('Xác nhận loại bỏ tệp tin âm thanh này?')) return;
    const list = lsGetJSON('historyIndex', []).filter(i => i.id !== item.id);
    lsSetJSON('historyIndex', list);
    lsRemove(item.id);
    card.remove();
    if(list.length === 0) elHistoryEmpty.classList.remove('hidden');
  });

  actionGroup.appendChild(playBtn);
  actionGroup.appendChild(dlBtn);
  actionGroup.appendChild(delBtn);
  
  card.appendChild(audio);
  card.appendChild(contentWrap);
  card.appendChild(actionGroup);
  elHistoryList.appendChild(card);
}

elDeleteAllBtn.addEventListener('click', () => {
  if (!confirm('Hành động xóa toàn bộ danh sách lịch sử lưu trữ? Không thể hoàn tác.')) return;
  lsGetJSON('historyIndex', []).forEach(item => lsRemove(item.id));
  lsRemove('historyIndex');
  elHistoryList.innerHTML = '';
  elHistoryEmpty.classList.remove('hidden');
});

// Utilities
function updateCharCount() { elCharCount.textContent = `${elTextInput.value.length} ký tự`; }
function esc(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function setLoadingState(on) {
  elGenerateBtn.disabled = on;
  elBtnPlayIcon.classList.toggle('hidden', on);
  elBtnSpinner.classList.toggle('hidden', !on);
  elBtnText.textContent = on ? 'Đang mã hóa dữ liệu văn bản...' : 'Khởi tạo chuyển đổi audio';
  elProgressWrap.classList.toggle('hidden', !on);
  if (on) {
    let progress = 0; elProgressBar.style.width = '0%';
    const task = setInterval(() => {
      progress = Math.min(progress + Math.random() * 12, 92);
      elProgressBar.style.width = progress + '%';
      if (!elGenerateBtn.disabled) {
        elProgressBar.style.width = '100%';
        setTimeout(() => { elProgressWrap.classList.add('hidden'); }, 300);
        clearInterval(task);
      }
    }, 150);
  }
}

function updateKeyBadges(activeIdx, failed) {
  for (let i = 1; i <= 5; i++) {
    const badge = document.getElementById(`badge${i}`);
    if (!badge) continue;
    const val = document.getElementById(`apiKey${i}`).value.trim() || lsGet(`apiKey${i}`) || '';
    if (!val) { badge.textContent = ''; badge.className = 'key-status'; continue; }
    
    const idx = i - 1;
    if (failed.includes(idx)) {
      badge.textContent = '✗ Hết Quota'; badge.className = 'key-status error';
    } else if (idx === activeIdx) {
      badge.textContent = '✓ Active'; badge.className = 'key-status active';
    } else {
      badge.textContent = '· Chờ'; badge.className = 'key-status standby';
    }
  }
}

function toast(msg, type = 'info') {
  clearTimeout(toastTimer);
  elToast.textContent = msg;
  elToast.className = `toast ${type}`;
  toastTimer = setTimeout(() => { elToast.className = 'toast hidden'; }, 4000);
}
</script>
</body>
</html>
